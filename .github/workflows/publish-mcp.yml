# Publishes server.json to the official MCP Registry.
# Independent of .github/workflows/publish.yml (npm). No registry tokens.
# Docs: https://modelcontextprotocol.io/registry/github-actions
# CLI:  https://github.com/modelcontextprotocol/registry/blob/main/docs/reference/cli/commands.md
name: Publish to MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (e.g. v0.3.2)
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Resolve publish tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$TAG_INPUT"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::tag must match vMAJOR.MINOR.PATCH (got ${TAG})"
              exit 1
            fi
            if ! git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" ls-remote --exit-code --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null; then
              echo "::error::refs/tags/${TAG} does not exist"
              exit 1
            fi
          else
            TAG="$REF_NAME"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved publish tag: ${TAG}"

      - name: Checkout tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Verify server.json version matches tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          actual="$(jq -r '.version' server.json)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::server.json version ${actual} does not match tag ${TAG} (expected ${expected})"
            exit 1
          fi
          echo "server.json version ${actual} matches tag ${TAG}"

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc # linux_amd64
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
