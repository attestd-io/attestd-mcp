# Publishes server.json to the official MCP Registry.
# Independent of .github/workflows/publish.yml (npm). No registry tokens.
# Docs: https://modelcontextprotocol.io/registry/github-actions
# CLI:  https://github.com/modelcontextprotocol/registry/blob/main/docs/reference/cli/commands.md
name: Publish to MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (e.g. v0.3.2). Leave empty to use the latest v* tag.
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Resolve publish tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$TAG_INPUT" ]; then
              TAG="$TAG_INPUT"
            else
              TAG="$(git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" ls-remote --tags --refs --sort=-v:refname "https://github.com/${GITHUB_REPOSITORY}.git" 'v*' | awk 'NR==1 { print $2 }' | sed 's#^refs/tags/##')"
              if [ -z "$TAG" ]; then
                echo "::error::No v* tags found"
                exit 1
              fi
            fi
          else
            TAG="$REF_NAME"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved publish tag: ${TAG}"

      - name: Checkout tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Verify server.json version matches tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          actual="$(jq -r '.version' server.json)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::server.json version ${actual} does not match tag ${TAG} (expected ${expected})"
            exit 1
          fi
          echo "server.json version ${actual} matches tag ${TAG}"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
